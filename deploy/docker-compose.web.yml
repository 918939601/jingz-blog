services:
  blogweb:
    build:
      context: ..
      dockerfile: Dockerfile.web
    image: jingz-blog-web:latest
    container_name: jingz-blog-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SITE_URL: http://124.223.57.73:3000
      NEXT_PUBLIC_ADMIN_EMAILS: you@example.com
      AUTH_SECRET: replace-me
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://124.223.57.73:3000
      NEXTAUTH_URL: http://124.223.57.73:3000
      AUTH_GITHUB_ID: replace-me
      AUTH_GITHUB_SECRET: replace-me
      NEXT_PUBLIC_GO_API_BASE: http://124.223.57.73:8080
      GO_API_BASE: http://124.223.57.73:8080
      REVALIDATE_SECRET: replace-me
      UPLOADTHING_TOKEN: replace-me
      DATABASE_URL: postgres://username:password@db-host:5432/blog?sslmode=require

